version: "3.8"

services:
  server:
    build:
      context: ./server
    container_name: rps_server
    ports:
      - "12345:12345"
    restart: always
    networks:
      - rps-network

  proxy:
    build:
      context: ./proxy
    container_name: rps_proxy
    depends_on:
      - server
    ports:
      - "8080:8080"
    environment:
      - SERVER_HOST=server
      - SERVER_PORT=12345
    restart: always
    networks:
      - rps-network

  client:
    build:
      context: ./client
    container_name: rps_client
    depends_on:
      - proxy
    ports:
      - "80:80"
    tty: true
    stdin_open: true
    restart: always
    networks:
      - rps-network

networks:
  rps-network:
    driver: bridge
